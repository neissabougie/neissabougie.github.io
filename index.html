<style>
/* Layout: Etiketten-Look der Marke (Didone + Schreibschrift, schwarz auf Papierweiß), randloses Produktraster wie bei Parfum-Maisons, Kategorien als klebende Leiste. Bewusst nur ein helles Farbschema, passend zu den Etiketten. */
:root {
  --paper: #fbfaf8;
  --ink: #141113;
  --soft: #6b6468;
  --line: #ddd7d4;
  --blush: #f2e6e4;
  --wa: #1c7c4a;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --f-body: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-weight: 400; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.caps { font-family: var(--f-body); font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 500; }

.topbar { background: var(--ink); color: var(--paper); text-align: center; }
.topbar .wrap { padding-block: 9px; }

header.mast { text-align: center; padding-block: 44px 28px; }
.mono { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; letter-spacing: -.06em; font-weight: 500; }
.mono span { display: inline-block; transform: translateX(-.08em); }
.brand { font-family: var(--f-display); font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: .42em; margin: 12px 0 0 .42em; font-weight: 400; }
.orn { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink); margin: 14px auto 0; }
.orn::before, .orn::after { content: ""; width: 48px; height: 1px; background: var(--ink); }
.mast .sub { margin-top: 14px; color: var(--soft); }
.mast p.intro a { color: var(--ink); text-underline-offset: 3px; }
.mast p.intro { max-width: 52ch; margin: 22px auto 0; color: var(--soft); text-wrap: pretty; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
nav.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
nav.cats .wrap { display: flex; gap: 6px; overflow-x: auto; justify-content: safe center; padding-block: 6px; scrollbar-width: none; }
nav.cats .wrap::-webkit-scrollbar { display: none; }
.cat-btn { flex: none; background: none; border: 0; color: var(--soft); cursor: pointer; padding: 12px 14px; font: 500 .74rem/1 var(--f-body); letter-spacing: .24em; text-transform: uppercase; border-bottom: 1px solid transparent; }
.cat-btn[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.cat-btn .n { font-variant-numeric: tabular-nums; letter-spacing: .05em; opacity: .6; margin-left: 4px; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

main { padding-block: 40px 20px; }
section.cat { margin-bottom: 64px; scroll-margin-top: 70px; }
.cat-head { text-align: center; margin-bottom: 28px; }
.cat-head h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.6rem); margin: 4px 0 0; line-height: 1.1; text-wrap: balance; }
.cat-head p { color: var(--soft); margin: 10px auto 0; max-width: 46ch; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 28px; } }
@media (min-width: 1080px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.prod { background: none; border: 0; padding: 0; text-align: center; color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prod .ph { aspect-ratio: 4 / 5; max-width: 100%; width: 100%; overflow: hidden; background: var(--blush); }
.prod .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
@media (hover: hover) { .prod:hover .ph img { transform: scale(1.04); } }
.pname { line-height: 1; }
.pname .a { display: block; font-family: var(--f-display); font-weight: 500; font-size: clamp(.95rem, 3.4vw, 1.2rem); letter-spacing: .06em; text-transform: uppercase; }
.pname .b { display: block; font-family: var(--f-script); font-size: clamp(1.45rem, 5vw, 1.9rem); line-height: 1.1; margin-top: 2px; }
.prod .preis { font-family: var(--f-body); font-size: .82rem; letter-spacing: .14em; font-weight: 500; margin-top: -4px; }
.prod .slogan { font-family: var(--f-display); font-style: italic; font-size: .9rem; color: var(--soft); line-height: 1.35; padding-inline: 4px; text-wrap: balance; }

/* Wunschkerze */
section.wish { background: var(--blush); }
section.wish .wrap { padding-block: 56px; display: grid; gap: 28px; }
@media (min-width: 860px) { section.wish .wrap { grid-template-columns: 1fr 1.1fr; gap: 56px; align-items: start; } }
.wish h2, .contact h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.8rem); margin: 6px 0 0; line-height: 1.05; }
.wish h2 em, .contact h2 em { font-family: var(--f-script); font-style: normal; font-size: 1.25em; font-weight: 400; }
.wish .lead { color: var(--soft); max-width: 44ch; }
.steps { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; }
.steps b { font-family: var(--f-display); font-weight: 500; font-size: 1.1rem; }
form.wf { background: var(--paper); padding: 24px; display: grid; gap: 16px; min-width: 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
.field input[type=text], .field textarea, .field select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 0; padding: 12px; width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.drop { border: 1px dashed var(--soft); padding: 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .prev { width: 64px; height: 64px; flex: none; background: var(--blush) center/cover no-repeat; display: grid; place-items: center; font-size: 1.6rem; color: var(--soft); }
.drop .t { font-size: .92rem; color: var(--soft); min-width: 0; overflow-wrap: anywhere; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; cursor: pointer; padding: 15px 22px; font: 500 .78rem/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); flex: 1 1 200px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.note { font-size: .9rem; color: var(--ink); margin: 0; padding: 10px 12px; background: var(--blush); }
.note[data-ok] { color: var(--ink); }

section.contact .wrap { padding-block: 56px; text-align: center; }
.contact .lead { color: var(--soft); max-width: 44ch; margin: 12px auto 24px; }
.contact .btns { justify-content: center; max-width: 560px; margin: 0 auto; }
.addr { margin-top: 22px; display: grid; gap: 6px; justify-content: center; font-variant-numeric: tabular-nums; }
.addr div { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.addr span.v { user-select: all; }
.copy { background: none; border: 0; border-bottom: 1px solid var(--soft); color: var(--soft); cursor: pointer; font: inherit; font-size: .8rem; padding: 0; }
footer { border-top: 1px solid var(--line); text-align: center; color: var(--soft); }
footer .wrap { padding-block: 22px 32px; }

/* Detail */
.sheet-bg { position: fixed; inset: 0; background: rgb(20 17 19 / .5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 900px; max-height: 94vh; overflow-y: auto; position: relative; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .sheet-bg { align-items: center; padding: 24px; } .sheet { display: grid; grid-template-columns: 1fr 1fr; } }
.sheet .ph { aspect-ratio: 4 / 5; max-width: 100%; background: var(--blush); }
@media (max-width: 759px) { .sheet .ph { aspect-ratio: 1 / 1; } }
.sheet .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet .info { padding: 28px 22px 8px; display: flex; flex-direction: column; gap: 14px; text-align: center; justify-content: center; min-width: 0; }
.sheet .pname .a { font-size: 1.5rem; }
.sheet .pname .b { font-size: 2.6rem; }
.sheet .fr { font-family: var(--f-display); font-style: italic; font-size: 1.1rem; margin: 0; text-wrap: balance; }
.sheet .de { color: var(--soft); margin: 0; font-size: .95rem; }
.sheet dl { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 4px 14px; margin: 4px 0; font-size: .9rem; text-align: left; }
.sheet dt { color: var(--soft); }
.sheet dd { margin: 0; }
.close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 42px; height: 42px; border: 0; background: var(--paper); color: var(--ink); font-size: 1.5rem; line-height: 1; cursor: pointer; border-radius: 50%; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(20px); opacity: .5; } } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .prod .ph img { transition: none; } }

/* Sprachwahl */
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar .claim { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang { display: flex; gap: 2px; flex: none; }
.lang button { background: none; border: 0; color: var(--paper); opacity: .55; font: 500 .72rem/1 var(--f-body); letter-spacing: .14em; padding: 6px 7px; cursor: pointer; }
.lang button[aria-pressed="true"] { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.lang button:focus-visible { outline-color: var(--paper); }

/* Geschenksets */
.duo { position: relative; aspect-ratio: 4 / 5; max-width: 100%; width: 100%; background: var(--blush); overflow: hidden; display: block; }
.duo img { position: absolute; width: 62%; aspect-ratio: 4 / 5; object-fit: cover; box-shadow: 0 10px 24px rgb(20 17 19 / .18); transition: transform .6s ease; }
.duo img:nth-child(1) { left: 6%; top: 7%; transform: rotate(-4deg); }
.duo img:nth-child(2) { right: 6%; bottom: 13%; transform: rotate(3deg); }
@media (hover: hover) { .prod:hover .duo img:nth-child(1) { transform: rotate(-7deg) translateX(-4px); } .prod:hover .duo img:nth-child(2) { transform: rotate(6deg) translateX(4px); } }
.duo .bow { position: absolute; left: 0; right: 0; bottom: 0; height: 13%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 .62rem/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; }
.duo .bow svg { flex: none; }
.gift-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; text-align: left; font-size: .92rem; justify-content: center; }
.gift-list li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
.gift-list li::before { content: "✦"; font-size: .7rem; line-height: 1.9; }
.occ { color: var(--soft); font-size: .88rem; margin: 0; }
.card-msg { display: grid; gap: 6px; text-align: left; }
.card-msg label { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
.card-msg textarea { font: inherit; font-family: var(--f-display); font-style: italic; color: var(--ink); background: #fff; border: 1px solid var(--line); padding: 12px; min-height: 76px; resize: vertical; width: 100%; }
.age { font-size: .76rem; color: var(--soft); margin: 0; }

/* Geschenk-Animation */
.gift-anim { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(251 250 248 / .94); cursor: pointer; }
.gbox { position: relative; width: 150px; height: 150px; }
.gbox .body { position: absolute; left: 10px; right: 10px; bottom: 0; height: 100px; background: var(--ink); }
.gbox .lid { position: absolute; left: 0; right: 0; top: 22px; height: 34px; background: var(--ink); transform-origin: 50% 100%; }
.gbox .rib-v { position: absolute; left: 50%; width: 16px; margin-left: -8px; top: 0; bottom: 0; background: #c9a35b; }
.gbox .knot { position: absolute; left: 50%; top: -28px; width: 70px; height: 30px; margin-left: -35px; }
.gbox .knot::before, .gbox .knot::after { content: ""; position: absolute; bottom: 0; width: 32px; height: 26px; border: 6px solid #c9a35b; border-radius: 50% 50% 0 50%; }
.gbox .knot::before { left: 0; transform: rotate(-20deg); }
.gbox .knot::after { right: 0; transform: rotate(20deg) scaleX(-1); }
.gbox .mono-g { position: absolute; left: 0; right: 0; bottom: -44px; color: var(--ink) !important; text-align: center; color: var(--paper); font-family: var(--f-display); font-size: 1.5rem; letter-spacing: -.04em; z-index: 1; }
.spark { position: absolute; left: 50%; top: 40%; width: 8px; height: 8px; margin: -4px; background: var(--ink); opacity: 0; }
.spark:nth-child(odd) { background: #c9a35b; border-radius: 50%; }
.gift-anim.play .gbox { animation: wiggle .5s ease-in-out 2; }
.gift-anim.open .lid { animation: lidOff .55s cubic-bezier(.3,.7,.4,1) forwards; }
.gift-anim.open .spark { animation: burst .8s ease-out forwards; }
.gift-anim.done { animation: fadeOut .3s ease forwards; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes lidOff { to { transform: translateY(-120px) rotate(-24deg); opacity: 0; } }
@keyframes burst { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(160deg); } }
@keyframes fadeOut { to { opacity: 0; } }
.sheet .ph .duo { height: 100%; aspect-ratio: auto; }
.sheet .ph .duo img { width: 58%; }

/* E-Mail-Auswahl */
.mail-bg { position: fixed; inset: 0; z-index: 40; background: rgb(20 17 19 / .5); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 760px) { .mail-bg { align-items: center; } }
.mail-box { background: var(--paper); width: 100%; max-width: 460px; padding: 26px 20px max(20px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; position: relative; text-align: center; max-height: 92vh; overflow-y: auto; }
.mail-box h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
.mail-box p { margin: 0; color: var(--soft); font-size: .92rem; }
.mail-box .btns { flex-direction: column; }
.mail-box .btn { flex: none; width: 100%; }
.mail-box .copyrow { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: .95rem; }
.mail-box pre { white-space: pre-wrap; text-align: left; font: inherit; font-size: .85rem; background: var(--blush); padding: 12px; margin: 0; max-height: 140px; overflow-y: auto; user-select: all; }
.free-form { display: grid; gap: 12px; text-align: left; }
.free-form .field label { font-size: .7rem; }
</style>
</head>

<div class="topbar"><div class="wrap caps"><span class="claim" data-t="claim"></span>
  <div class="lang" role="group" aria-label="Sprache / Langue / Language">

const T = {
  de: {
    upl: "Bild wird hochgeladen …", uplFail: "Das Hochladen hat nicht geklappt. Bitte hänge das Bild im Chat selbst an.", lImgLink: "Bild", shareBtn: "Bild direkt teilen", noteSent: "Gesendet wird mit Bild-Link. Neïssa sieht dein Foto direkt in der Nachricht.", noteShared: "Wähle im Teilen-Menü WhatsApp und dann den Chat mit Neïssa Bougie (+49 157 32894746).", 
    freeBadge: "Selbst wählen", c1: "Kerze 1", c2: "Kerze 2", chocChoice: "Schokolade", wineChoice: "Wein",

    const w = (k / 12) * Math.PI * 2, r = 90 + (k % 3) * 30;
    s.style.setProperty("--dx", Math.cos(w) * r + "px"); s.style.setProperty("--dy", Math.sin(w) * r - 40 + "px");
  });
  el.className = "gift-anim"; el.hidden = false;
  let done = false;
  const ende = () => { if (done) return; done = true; el.classList.add("done"); fertig(); setTimeout(() => { el.hidden = true; el.className = "gift-anim"; }, 300); };
  void el.offsetWidth; el.classList.add("play");
  const t1 = setTimeout(() => el.classList.add("open"), 900);
  const t2 = setTimeout(ende, 1700);
  el.onclick = () => { clearTimeout(t1); clearTimeout(t2); ende(); };
}

// Wunschkerze
let bild = null;
$("#wFile").addEventListener("change", (e) => {
  bild = e.target.files && e.target.files[0] || null;
  const pv = $("#wPrev");
  if (bild) { pv.style.backgroundImage = `url("${URL.createObjectURL(bild)}")`; pv.textContent = ""; $("#wFileTxt").textContent = bild.name; }
  else { pv.style.backgroundImage = ""; pv.textContent = "+"; $("#wFileTxt").textContent = t("pickImg"); }

function wunschText(link) {
  const n = $("#wName").value.trim(), k = $("#wKat").value, w = $("#wText").value.trim();
  const img = link ? `\n${t("lImgLink")}: ${link}` : (bild ? "\n" + t("lImg") : "");
  return `${t("msgWish")}\n${t("lKind")}: ${k}${w ? `\n${t("lWish")}: ${w}` : ""}${n ? `\n${t("lName")}: ${n}` : ""}${img}`;
}
const uploadAktiv = () => !!(SHOP.cloudinary.cloud && SHOP.cloudinary.preset);
const handy = matchMedia("(pointer: coarse)").matches;
// Foto verkleinern (max. 1600 px), damit der Upload schnell geht
async function verkleinern(file) {
  try {
    const bmp = await createImageBitmap(file);
    const f = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}
let hochgeladen = { datei: null, url: "" };
async function bildLink() {
  if (!bild || !uploadAktiv()) return "";
  if (hochgeladen.datei === bild) return hochgeladen.url;
  const fd = new FormData();
  fd.append("file", await verkleinern(bild));
  fd.append("upload_preset", SHOP.cloudinary.preset);
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(`https://api.cloudinary.com/v1_1/${SHOP.cloudinary.cloud}/image/upload`, { method: "POST", body: fd, signal: ctrl.signal });
    const j = await r.json();
    if (!r.ok || !j.secure_url) throw new Error("upload");
    hochgeladen = { datei: bild, url: j.secure_url };
    return j.secure_url;
  } finally { clearTimeout(tm); }
}
let sendet = false;
async function senden(kanal) {
  if (sendet) return;
  const note = $("#wNote");
  // Auf dem Computer das Fenster sofort öffnen (sonst blockiert der Browser es nach dem Upload)
  const fenster = (bild && uploadAktiv() && !handy) ? window.open("", "_blank") : null;
  let link = "";
  if (bild && uploadAktiv()) {
    sendet = true; note.textContent = t("upl"); note.hidden = false;
    try { link = await bildLink(); } catch { link = ""; }
    sendet = false;
  }
  const text = wunschText(link);
  if (kanal === "wa") {
    const ziel = waLink(text);
    if (fenster) fenster.location.href = ziel;
    else if (bild && uploadAktiv()) location.href = ziel;
    else { const a = document.createElement("a"); a.href = ziel; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
  } else {
    if (fenster) fenster.close();
    const a = document.createElement("a"); a.href = mailLink(t("subjWish"), text); document.body.appendChild(a); a.click(); a.remove();
  }
  // Hinweis nur zeigen, wenn das Bild nicht mitgeschickt werden konnte
  if (bild && !link) { note.textContent = uploadAktiv() ? t("uplFail") : t("noteImg"); note.hidden = false; }
  else note.hidden = true;
}
$("#wSendWa").addEventListener("click", () => senden("wa"));
$("#wSendMail").addEventListener("click", () => senden("mail"));
